[package]
name = "synthetic-echo-candidate"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.42"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
